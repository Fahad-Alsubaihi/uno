services:
  traefik:
    image: traefik:v3.0
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=fahad.work20@gmail.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  client:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      # HTTPS
      - traefik.http.routers.uno.rule=Host(`codegenuis.com`) || Host(`www.codegenuis.com`)
      - traefik.http.routers.uno.entrypoints=websecure
      - traefik.http.routers.uno.tls.certresolver=letsencrypt
      - traefik.http.services.uno.loadbalancer.server.port=80
      # HTTP → HTTPS redirect
      - traefik.http.routers.uno-http.rule=Host(`codegenuis.com`) || Host(`www.codegenuis.com`)
      - traefik.http.routers.uno-http.entrypoints=web
      - traefik.http.routers.uno-http.middlewares=https-redirect
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true

volumes:
  letsencrypt:
