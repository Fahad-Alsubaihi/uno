networks:
  n8n_traefik_public:
    external: true

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
    restart: unless-stopped
    networks:
      - n8n_traefik_public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  client:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - n8n_traefik_public
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_traefik_public
      # HTTPS
      - traefik.http.routers.uno.rule=Host(`uno.codegenuis.com`)
      - traefik.http.routers.uno.entrypoints=websecure
      - traefik.http.routers.uno.tls.certresolver=letsencrypt
      - traefik.http.services.uno.loadbalancer.server.port=80
      # HTTP → HTTPS redirect
      - traefik.http.routers.uno-http.rule=Host(`uno.codegenuis.com`)
      - traefik.http.routers.uno-http.entrypoints=web
      - traefik.http.routers.uno-http.middlewares=uno-https-redirect
      - traefik.http.middlewares.uno-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.uno-https-redirect.redirectscheme.permanent=true
